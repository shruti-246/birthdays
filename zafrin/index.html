<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Zafrin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one centered "stage" over a night sky; each screen is a scene that replaces the last. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --sky-top: #0e1433;
  --sky-bottom: #2a1f4d;
  --ink: #f5efe6;
  --muted: #b9b3d6;
  --gold: #ffcf6e;
  --rose: #ff8fa3;
  --paper: #fbf5ea;
  --paper-ink: #3a2e4a;
  --dog: #e9b77a;
  --dog-dark: #a8713c;
  --tear: #7fd0ff;
  --font-display: "Gaegu", "Comic Sans MS", cursive;
  --font-body: "Nunito", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", cursive;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow-x: hidden;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main {
  position: relative; z-index: 1;
  min-height: 100%;
  display: grid; place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.scene {
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  text-align: center;
  animation: rise .6s ease both;
}
@keyframes rise { from { opacity: .0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 9vw, 3.4rem); color: var(--gold); }
h2 { font-size: clamp(1.9rem, 7vw, 2.5rem); }
p { margin: 0; line-height: 1.55; color: var(--muted); max-width: 34ch; }
.small { font-size: .85rem; letter-spacing: .04em; }

button {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
  border: 0; border-radius: 999px; padding: 10px 28px; cursor: pointer;
  background: var(--gold); color: var(--sky-top);
  box-shadow: 0 4px 0 #c99a3b;
  transition: transform .15s, box-shadow .15s;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c99a3b; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--muted); }

input[type=text] {
  font-family: var(--font-display); font-size: 1.6rem; text-align: center;
  width: 100%; max-width: 280px; box-sizing: border-box;
  background: rgba(255,255,255,.08); color: var(--ink);
  border: 2px dashed var(--muted); border-radius: 14px; padding: 10px;
}
.msg { min-height: 1.6em; font-family: var(--font-display); font-size: 1.35rem; color: var(--rose); }

/* Dog */
.dog { width: 190px; max-width: 60vw; }
.dog .tear { fill: var(--tear); opacity: 0; }
.dog.crying .tear { animation: drip 1.1s linear infinite; }
.dog.crying .tear.t2 { animation-delay: .55s; }
.dog.sobbing .tear { animation: drip .6s linear infinite; }
.dog.sobbing .tear.t2 { animation-delay: .3s; }
@keyframes drip { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(46px); } }
.dog.happy { animation: wiggle .5s ease-in-out 3; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.dog .mouth, .dog .brow { transition: d .3s; }
.bubble {
  background: var(--paper); color: var(--paper-ink);
  font-family: var(--font-display); font-size: 1.45rem; line-height: 1.15;
  padding: 12px 18px; border-radius: 18px; position: relative; max-width: 300px;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: var(--paper); }
.choices { position: relative; width: 100%; height: 130px; }
.choices button { position: absolute; top: 20px; transition: left .25s, top .25s, transform .25s, font-size .25s; }
#yesBtn { left: calc(50% - 140px); }
#noBtn { left: calc(50% + 30px); }

/* Cake */
.cake { width: 240px; max-width: 70vw; }
.flame { fill: var(--gold); transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; cursor: pointer; }
.flame.out { animation: none; opacity: 0; transition: opacity .3s; }
.smoke { fill: none; stroke: #cfc8e6; stroke-width: 2; opacity: 0; }
.smoke.on { animation: smoke 1.4s ease-out forwards; }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.85, 1.12) rotate(3deg); } }
@keyframes smoke { 0% { opacity: .8; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-24px); } }
.dimmed { filter: brightness(.55); transition: filter 1s; }

/* Balloons */
.balloons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; width: 100%; }
.balloon {
  aspect-ratio: 4/5; max-width: 100%; border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
  position: relative; padding: 0; box-shadow: inset -8px -10px 0 rgba(0,0,0,.12);
  animation: bob 3s ease-in-out infinite;
}
.balloon:nth-child(2n) { animation-delay: -1.2s; }
.balloon:nth-child(3n) { animation-delay: -2.1s; }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 1px; height: 14px; background: var(--muted); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.balloon.popped { animation: pop .25s forwards; pointer-events: none; }
@keyframes pop { to { transform: scale(1.4); opacity: 0; } }
.note {
  font-family: var(--font-hand); font-size: 1.55rem; line-height: 1.2; color: var(--paper-ink);
  background: var(--paper); padding: 12px 16px; border-radius: 6px; transform: rotate(-1.5deg);
  min-height: 2.4em; display: grid; place-items: center; width: 100%; box-sizing: border-box;
}

/* Polaroid */
.polaroid { background: var(--paper); padding: 14px 14px 18px; border-radius: 4px; transform: rotate(-3deg); box-shadow: 0 18px 40px rgba(0,0,0,.45); width: 280px; max-width: 80vw; box-sizing: border-box; }
.photo { aspect-ratio: 1; width: 100%; background: #2c2a33; overflow: hidden; display: grid; place-items: center; }
.photo img, .photo .placeholder { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(.15) blur(4px); transition: filter 3.5s ease; }
.photo.developed img, .photo.developed .placeholder { filter: none; }
.placeholder { display: grid; place-items: center; background: linear-gradient(135deg, #ffd6a5, #ffadc6 60%, #c3b1ff); color: var(--paper-ink); font-family: var(--font-display); font-size: 1.3rem; padding: 16px; box-sizing: border-box; }
.caption { font-family: var(--font-hand); font-size: 1.5rem; color: var(--paper-ink); margin-top: 10px; }

/* Envelope + letter */
.envelope { width: 260px; max-width: 80vw; aspect-ratio: 3/2; position: relative; cursor: pointer; background: none; padding: 0; box-shadow: none; border-radius: 6px; }
.envelope .body { position: absolute; inset: 0; background: #e8d9c0; border-radius: 6px; }
.envelope .flap { position: absolute; inset: 0 0 35% 0; background: #dcc9a8; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s; z-index: 2; }
.envelope .seal { position: absolute; left: 50%; top: 52%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #c2405a; z-index: 3; display: grid; place-items: center; color: var(--paper); font-family: var(--font-hand); font-size: 1.6rem; transition: opacity .3s; }
.envelope.open .flap { transform: rotateX(180deg); z-index: 0; }
.envelope.open .seal { opacity: 0; }
.letter {
  background: var(--paper); color: var(--paper-ink); text-align: left;
  font-family: var(--font-hand); font-size: 1.5rem; line-height: 1.35;
  padding: 24px 22px; border-radius: 4px; width: 100%; box-sizing: border-box;
  background-image: repeating-linear-gradient(transparent 0 calc(1.35em - 1px), rgba(58,46,74,.12) calc(1.35em - 1px) 1.35em);
  background-position: 0 20px;
  box-shadow: 0 18px 40px rgba(0,0,0,.4);
}
.letter p { color: inherit; max-width: none; margin-bottom: .6em; line-height: inherit; }
.letter .sign { text-align: right; font-weight: 700; white-space: pre-line; }
.type-caret { display: inline-block; width: 2px; height: 1em; background: var(--paper-ink); margin-left: 2px; vertical-align: -2px; animation: caret 1s steps(1) infinite; }

/* Coupon */
.coupon { border: 3px dashed var(--gold); border-radius: 16px; padding: 18px; width: 100%; box-sizing: border-box; }
.coupon .label { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
.coupon .what { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; margin: 6px 0; }

#sound { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font-size: 1rem; padding: 6px 12px; box-shadow: none; background: rgba(255,255,255,.12); color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Photobooth strip */
.booth { display: flex; flex-direction: column; align-items: center; width: 100%; }
.slot { width: 240px; max-width: 75vw; height: 28px; background: #e9e4f2; border-radius: 10px; box-shadow: 0 8px 18px rgba(0,0,0,.4); position: relative; z-index: 2; }
.slot::after { content: ""; position: absolute; left: 9%; right: 9%; top: 50%; height: 7px; margin-top: -3px; background: #1a1530; border-radius: 4px; }
.strip-window { width: 200px; max-width: 62vw; height: 440px; max-height: 58vh; overflow: hidden; margin-top: -14px; position: relative; z-index: 1;
  -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
.strip { background: var(--paper); padding: 0 10px; transform: translateY(-100%); outline: 2px dashed rgba(58,46,74,.18); outline-offset: -5px; }
.strip .frame { padding-top: 10px; }
.strip .frame img, .strip .frame .placeholder { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.strip.printing { animation: print 3.5s cubic-bezier(.25,.7,.35,1) forwards; }
.strip.looping { transform: translateY(-50%); animation: loop var(--loop-dur, 12s) linear infinite; }
@keyframes print { from { transform: translateY(-100%); } to { transform: translateY(-50%); } }
@keyframes loop { from { transform: translateY(-50%); } to { transform: translateY(0); } }
.booth-caption { font-family: var(--font-hand); font-size: 1.7rem; color: var(--gold); transform: rotate(-2deg); }
@media (prefers-reduced-motion: reduce) { .strip, .strip.printing, .strip.looping { animation: none !important; transform: translateY(-50%); } }

/* Keypad (birthday passcode) */
.lock { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; width: 100%; }
.cat { width: 150px; max-width: 42vw; }
.cat .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.cat .ear { transform-box: fill-box; transform-origin: bottom center; animation: twitch 5s infinite; }
@keyframes twitch { 0%, 88%, 100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }
.pad { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.code { display: flex; gap: 6px; align-items: center; }
.code span { width: 30px; height: 38px; border: 2px solid var(--muted); border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.5rem; color: var(--gold); }
.code span.filled { border-color: var(--gold); }
.code i { color: var(--muted); font-style: normal; }
.code-labels { display: flex; gap: 46px; font-size: .7rem; letter-spacing: .14em; color: var(--muted); }
.code.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keys { display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; }
.keys button { width: 58px; height: 58px; padding: 0; font-size: 1.6rem; background: rgba(255,255,255,.1); color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
.keys button:active { background: rgba(255,207,110,.35); transform: none; box-shadow: inset 0 0 0 2px var(--gold); }

/* Memories search page */
.browser { width: 100%; background: #fff; color: #202124; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.45); text-align: left; font-family: Arial, var(--font-body); }
.browser-bar { display: flex; gap: 6px; align-items: center; padding: 10px 12px; background: #f1f3f4; }
.browser-bar b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.browser-bar .url { flex: 1; min-width: 0; margin-left: 8px; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: .78rem; color: #5f6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.browser-body { padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.logo { font-family: "Product Sans", Arial, sans-serif; font-size: 2.6rem; text-align: center; letter-spacing: -1px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid #dfe1e5; border-radius: 999px; padding: 9px 14px; font-size: .95rem; box-shadow: 0 1px 6px rgba(32,33,36,.18); min-height: 1.2em; }
.search .caret { width: 1px; height: 1.1em; background: #202124; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.tabs { display: flex; gap: 16px; font-size: .8rem; color: #5f6368; border-bottom: 1px solid #ebebeb; padding-bottom: 6px; overflow-x: auto; }
.tabs .on { color: #1a73e8; border-bottom: 3px solid #1a73e8; padding-bottom: 3px; }
.results-meta { font-size: .75rem; color: #70757a; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.results button { padding: 0; border-radius: 8px; overflow: hidden; background: #eee; box-shadow: none; aspect-ratio: 1; animation: rise .5s ease both; }
.results img, .results .placeholder { width: 100%; height: 100%; object-fit: cover; display: block; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8,10,30,.85); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lightbox figure { margin: 0; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.lightbox img, .lightbox .placeholder { width: 100%; max-height: 65vh; object-fit: contain; border-radius: 10px; }
.lightbox figcaption { font-family: var(--font-hand); font-size: 1.6rem; color: var(--ink); text-align: center; }

/* Three items to open */
.items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
.item { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); border-radius: 18px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 1.1rem; color: var(--ink); animation: bob 3s ease-in-out infinite; }
.item:nth-child(2) { animation-delay: -1s; } .item:nth-child(3) { animation-delay: -2s; }
.item svg { width: 100%; max-width: 100px; height: auto; }
.item.done { box-shadow: inset 0 0 0 2px var(--gold); }
.item .tick { font-size: .8rem; color: var(--gold); min-height: 1.1em; font-family: var(--font-body); }
.back { font-size: 1.1rem; padding: 6px 18px; }

/* Retro TV */
.tv { width: 100%; max-width: 380px; background: #c76b4a; border-radius: 26px; padding: 18px 18px 46px; box-sizing: border-box; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.tv::before, .tv::after { content: ""; position: absolute; bottom: 14px; width: 18px; height: 18px; border-radius: 50%; background: #3a2e4a; }
.tv::before { right: 26px; } .tv::after { right: 54px; }
.tv-screen { background: #111; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; display: grid; place-items: center; }
.tv-screen video { width: 100%; height: 100%; object-fit: contain; background: #111; display: block; }
.tv-empty { color: #b9b3d6; font-family: var(--font-display); font-size: 1.3rem; padding: 16px; text-align: center; }
.tv-antenna { width: 120px; height: 40px; margin-bottom: -6px; }

/* Cassette player */
.cassette { width: 280px; max-width: 80vw; }
.reel { transform-box: fill-box; transform-origin: center; }
.playing .reel { animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* the YouTube player stays out of sight; only the music is heard */
.yt { position: fixed; left: -9999px; top: 0; width: 320px; height: 180px; opacity: 0; pointer-events: none; }
.yt iframe { width: 320px; height: 180px; border: 0; }
.song-title { font-family: var(--font-display); font-size: 1.5rem; color: var(--gold); }

/* Virtual hug */
.bears { width: 280px; max-width: 80vw; overflow: visible; }
.bear-l { animation: walkL 2.6s ease-in-out forwards; }
.bear-r { animation: walkR 2.6s ease-in-out forwards; }
@keyframes walkL { from { transform: translateX(-60px); } to { transform: translateX(22px); } }
@keyframes walkR { from { transform: translateX(60px); } to { transform: translateX(-22px); } }
.hugging { animation: squeeze .7s ease-in-out 2; transform-origin: 50% 90%; }
@keyframes squeeze { 50% { transform: scale(1.06, .95); } }
.heart-pop { opacity: 0; transform-box: fill-box; transform-origin: center; }
.hugging .heart-pop { animation: heart 1.4s ease-out forwards; }
@keyframes heart { 0% { opacity: 0; transform: translateY(10px) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }
.bar { width: 240px; max-width: 75vw; height: 14px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width .2s; }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>

<canvas id="stars" aria-hidden="true"></canvas>
<button id="sound" type="button" aria-pressed="false">♪ sound off</button>
<main id="stage"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
const CONFIG = {
  name: "Zafrin",
  birthdate: "19/10/02",   // her birth date as dd/mm/yy, e.g. "19/10/02". It's also the keypad code.
  from: "Shruti",
  candles: 5,
  // Photos of you two for the "moments of us" page, each with its own caption. Put the files in this folder.
  memories: [
    //{ src: "zafrin.png", caption: "this one lives rent free in my head" },
    { src: "Group01.png", caption: "Well, this is your favorite Group photo, i think that was india night!" },
    { src: "Group02.png", caption: "Your First birthday with US" },
    { src: "Group03.png", caption: "Roommates!???" },
    { src: "Group04.png", caption: "First time when we all wear sareeee" },
    { src: "Group05.png", caption: "The day before i lost my passport, talktime. damn itt" },
    { src: "Group06.png", caption: "Fun memories with wrong people" },
    { src: "Group07.png", caption: "You and meeee" },
    { src: "Group08.png", caption: "You me and our beaches" },
    { src: "Group09.png", caption: "After exposing the son of a bach, his 1st and 2nd wife" },
    { src: "Group10.png", caption: "then the 2nd wife joined us" },
    { src: "Group11.png", caption: "CDA new year. that was fun" },
    { src: "Group12.png ", caption: "Low key running out of captions" },
    { src: "Group13 .png", caption: "Ig my favorite picture" },
    
    // { src: "us1.jpg", caption: "write a little line for each photo" },
  ],
  // Photos of only her, for the photobooth strip.
  booth: ["zafrin.png", "image01.png", "image02.png", "image03.png", "image04.png", "image05.png", "image06.png",
    "image07.png", "image08.png", "image09.png", "image10.png", "image11.png", "image12.png", "image13.png", "image14.png"
  ],
  photoCaption: "my favorite versions of you",
  // Your song for the cassette. Put the mp3 in this folder, e.g. "song.mp3". Leave "" to play a birthday tune.
  song: "",
  // Or paste a YouTube link here instead (no download needed), e.g. "https://www.youtube.com/watch?v=XXXXXXXXXXX"
  youtube: "https://www.youtube.com/watch?v=26H76PJWnmA",
  songTitle: "Magnolia · Laufey",
  // Your video for the little TV. Put the mp4 in this folder, e.g. "video.mp4".
  video: "My.mp4",
  reasons: [
    "I pray God replaces any worry in your heart with deep lasting peace",
    "I hope you get to see all your biggest dreams come true and life opens up beautiful doors you never even expected.",
    "May God give you the courage and strength to keep moving forward",
    "May you always be surrounded by people who love you and lift you up.",
    "Life is infinitely brighter and more fun with you",
    "Here is to all the memories we had made so far, those countless laughs, late-night talks and the many more blind guiding the blind"
  ],
  letter: [
    "Zafrin,",
    "Job a asi baler, pore likhtesi. Sorryyyyyyyy",
  ],
  sign: "Yours, loudly and forever,\nShruti"
};

const stage = document.getElementById("stage");
const $ = (s, r = document) => r.querySelector(s);
const burst = (opts = {}) => { if (window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: .6 }, colors: ["#ffcf6e", "#ff8fa3", "#c3b1ff", "#7fd0ff"], ...opts }); };

/* ---------- tiny sound effects (Web Audio, off until tapped) ---------- */
let audio = null, soundOn = false;
const soundBtn = document.getElementById("sound");
soundBtn.onclick = () => {
  soundOn = !soundOn;
  if (soundOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  soundBtn.textContent = soundOn ? "♪ sound on" : "♪ sound off";
  soundBtn.setAttribute("aria-pressed", soundOn);
  if (soundOn) chime([523, 659, 784]);
};
function tone(freq, start, dur, type = "sine", vol = .12) {
  if (!soundOn || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audio.currentTime + start);
  g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + start + dur);
  o.connect(g).connect(audio.destination);
  o.start(audio.currentTime + start); o.stop(audio.currentTime + start + dur);
}
const chime = notes => notes.forEach((f, i) => tone(f, i * .12, .4));
const sadSound = () => { tone(392, 0, .35, "triangle"); tone(330, .3, .5, "triangle"); };
const popSound = () => tone(900, 0, .08, "square", .08);
function birthdaySong() {
  const n = [[392,.3],[392,.15],[440,.45],[392,.45],[523,.45],[494,.9],[392,.3],[392,.15],[440,.45],[392,.45],[587,.45],[523,.9]];
  let t = 0; n.forEach(([f, d]) => { tone(f, t, d * .95, "sine", .1); t += d; });
}

/* ---------- starry sky ---------- */
(() => {
  const c = document.getElementById("stars"), ctx = c.getContext("2d");
  let stars = [];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 3500) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height, r: (Math.random() * 1.3 + .3) * devicePixelRatio, p: Math.random() * 6
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      ctx.globalAlpha = still ? .7 : .35 + .65 * Math.abs(Math.sin(t / 1400 + s.p));
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); requestAnimationFrame(draw);
})();

function setMood(svg, mood) {
  svg.classList.remove("crying", "sobbing", "happy");

  $(".mouth", svg).setAttribute("fill-opacity", face === "happy" ? "1" : "0");
  $(".brow", svg).setAttribute("d", BROWS[face][0]);
  $(".b2", svg).setAttribute("d", BROWS[face][1]);

function show(html, setup) {
  stage.innerHTML = `<section class="scene">${html}</section>`;
  scrollTo({ top: 0, behavior: "smooth" });

}

function sceneKeypad() {
  // accepts "19/10/02", "19-10-2002", "19.10.02"... and turns it into the 6-digit code DDMMYY
  const [bd, bm, by] = (CONFIG.birthdate.match(/\d+/g) || []);
  const want = by ? String(bd).padStart(2, "0") + String(bm).padStart(2, "0") + String(by).slice(-2).padStart(2, "0") : null;
  show(`
    <h2>Security check, ${CONFIG.name}</h2>
    <p>The guard cat needs your birthday code. Day, month, year.</p>
    <div class="lock">
      ${catSVG()}
      <div class="pad">
        <div class="code" id="code" aria-live="polite">
          <span></span><span></span><i>/</i><span></span><span></span><i>/</i><span></span><span></span>
        </div>
        <div class="code-labels"><span>DD</span><span>MM</span><span>YY</span></div>
        <div class="keys" id="keys">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join("")}
          <button type="button" data-k="clear" aria-label="Clear">✕</button>
          <button type="button" data-k="0">0</button>
          <button type="button" data-k="back" aria-label="Delete">⌫</button>
        </div>
        <button type="button" id="unlock">Unlock</button>
      </div>
    </div>
    <div class="msg" id="padMsg" aria-live="polite"></div>`, s => {
    let typed = "", tries = 0;
    const boxes = [...s.querySelectorAll("#code span")];
    const paint = () => boxes.forEach((b, k) => { b.textContent = typed[k] || ""; b.classList.toggle("filled", !!typed[k]); });
    const press = k => {
      if (k === "clear") typed = "";
      else if (k === "back") typed = typed.slice(0, -1);
      else if (typed.length < 6) typed += k;
      tone(600 + typed.length * 40, 0, .06, "square", .05);
      paint();
    };
    $("#keys", s).onclick = e => { const b = e.target.closest("button"); if (b) press(b.dataset.k); };
    s.addEventListener("keydown", e => { if (/^\d$/.test(e.key)) press(e.key); if (e.key === "Backspace") press("back"); if (e.key === "Enter") $("#unlock", s).click(); });
    $("#unlock", s).onclick = () => {
      const msg = $("#padMsg", s);
      if (typed.length < 6) { msg.textContent = "Six digits please. DD MM YY."; return; }
      if (!want) { msg.textContent = "Psst, the birth year isn't set in CONFIG yet."; return; }
      if (typed === want) { msg.textContent = "Access granted. Hi bestie 💛"; chime([523, 659, 784, 1046]); setTimeout(sceneQuestion, 900); return; }
      tries++;
      const code = $("#code", s); code.classList.remove("shake"); void code.offsetWidth; code.classList.add("shake");
      const lines = ["Wrong code. The cat is judging you 😼", "Are you sure you're really Zafrin?", "Hint: it's today. You just have to remember the year 😌"];
      msg.textContent = lines[Math.min(tries - 1, 2)];
      typed = ""; paint(); sadSound();
    };
  });
}

function sceneQuestion() {
  show(`
    <div class="bubble" id="bubble">Hi ${CONFIG.name}! Do you want to see what's inside?</div>
    ${dogSVG()}
    <div class="choices" id="choices">
      <button id="yesBtn" type="button">Yes!</button>
      <button id="noBtn" type="button" class="ghost">No</button>
    </div>`, s => {
    const dog = $(".dog", s), bubble = $("#bubble", s), no = $("#noBtn", s), yes = $("#yesBtn", s), box = $("#choices", s);
    let nos = 0;
    const pleas = [
      ["sad", "Wait... no? 🥺"],
      ["crying", "But I made this just for you..."],
      ["sobbing", "*sniff* I practiced all week *sniff*"],
      ["sobbing", "PLEASE. I'll stop crying if you press Yes."],
    ];
    function sayNo() {
      const [mood, line] = pleas[Math.min(nos, pleas.length - 1)];
      nos++;
      setMood(dog, mood); bubble.textContent = line; sadSound();
      const scale = Math.max(.45, 1 - nos * .14);
      const w = box.clientWidth - 110;
      no.style.left = Math.round(Math.random() * Math.max(w, 10)) + "px";
      no.style.top = Math.round(Math.random() * 80) + "px";
      no.style.transform = `scale(${scale})`;
      yes.style.transform = `scale(${1 + nos * .12})`;
      if (nos >= 5) { no.textContent = "Yes!"; no.classList.remove("ghost"); no.onclick = sayYes; no.onpointerenter = null; }
    }
    function sayYes() {
      setMood(dog, "happy"); bubble.textContent = "YAYYY! Okay okay, follow me!";
      chime([659, 784, 988, 1318]); burst();
      no.disabled = yes.disabled = true;
      setTimeout(sceneCake, 1900);
    }
    yes.onclick = sayYes;
    no.onclick = sayNo;
    if (matchMedia("(hover: hover)").matches) no.onpointerenter = () => { if (nos < 5) sayNo(); };
  });
}

function sceneCake() {

  const candles = Array.from({ length: n }, (_, i) => {

    return `<rect x="${x - 4}" y="40" width="8" height="34" rx="3" fill="${colors[i % 5]}"/>
      <path class="smoke" data-i="${i}" d="M${x} 30 q-5 -8 0 -14 q5 -6 0 -12"/>
      <path class="flame" data-i="${i}" d="M${x} 22 q-8 10 0 18 q8 -8 0 -18z"/>`;
  }).join("");
  show(`
    <h2>Make a wish, ${CONFIG.name}</h2>
    <p id="cakeHint">Tap each candle to blow it out, or blow them all at once.</p>
    <svg class="cake" viewBox="0 0 240 200" role="img" aria-label="Birthday cake with candles">
      ${candles}
      <rect x="30" y="74" width="180" height="52" rx="10" fill="#ffb3c4"/>
      <path d="M30 92 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 30 0 V84 H30z" fill="#fff4f6"/>
      <rect x="18" y="126" width="204" height="56" rx="12" fill="#c3b1ff"/>
      <path d="M18 142 q17 14 34 0 q17 14 34 0 q17 14 34 0 q17 14 34 0 q17 14 34 0 q17 14 34 0 V136 H18z" fill="#fff4f6"/>
      <ellipse cx="120" cy="186" rx="118" ry="8" fill="rgba(0,0,0,.25)"/>
    </svg>
    <button id="blowAll" type="button">💨 Blow!</button>`, s => {
    let left = n;
    const out = i => {
      const f = $(`.flame[data-i="${i}"]`, s);
      if (!f || f.classList.contains("out")) return;
      f.classList.add("out"); $(`.smoke[data-i="${i}"]`, s).classList.add("on");
      tone(220 + left * 40, 0, .15, "triangle", .06);
      if (--left === 0) done();
    };
    s.querySelectorAll(".flame").forEach(f => f.onclick = () => out(f.dataset.i));
    $("#blowAll", s).onclick = () => { for (let i = 0; i < n; i++) setTimeout(() => out(i), i * 140); };
    function done() {
      $("#blowAll", s).hidden = true;
      $(".cake", s).classList.add("dimmed");
      $("h2", s).textContent = "Happy Birthday, " + CONFIG.name + "! 🎂";
      $("#cakeHint", s).textContent = "Your wish is officially on its way.";
      birthdaySong();
      setTimeout(() => { burst({ particleCount: 180, spread: 110 }); $(".cake", s).classList.remove("dimmed"); }, 700);
      const next = document.createElement("button");
      next.type = "button"; next.textContent = "What's next? →"; next.onclick = sceneBalloons;
      setTimeout(() => s.appendChild(next), 1600);
    }
  });
}

function scenePhotobooth() {
  const list = CONFIG.booth && CONFIG.booth.length ? CONFIG.booth.slice() : [""];
  let set = list.slice();
  while (set.length < 4) set = set.concat(list);   // enough frames to fill the strip
  const frame = src => `<div class="frame">${picHTML(src)}</div>`;
  show(`
    <h2>Look who it is</h2>
    <div class="booth">
      <div class="slot" aria-hidden="true"></div>
      <div class="strip-window"><div class="strip" id="strip">${set.concat(set).map(frame).join("")}</div></div>
    </div>
    <div class="booth-caption">${CONFIG.photoCaption}</div>
    <button type="button" class="ghost back" id="back">← Back</button>`, s => {
    const strip = $("#strip", s);
    strip.style.setProperty("--loop-dur", set.length * 3 + "s");
    requestAnimationFrame(() => strip.classList.add("printing"));
    strip.addEventListener("animationend", () => { strip.classList.remove("printing"); strip.classList.add("looping"); }, { once: true });
    $("#back", s).onclick = sceneItems;
  });
}

function sceneLetter() {

function typeLetter(s) {
  const paper = $("#letter", s), done = () => { $("#skip", s).hidden = true; $("#back", s).hidden = false; };
  $("#back", s).onclick = sceneItems;
  const parts = CONFIG.letter.map(t => ({ t, cls: "" })).concat([{ t: CONFIG.sign, cls: "sign" }]);
  let p = 0, c = 0, el = null, timer = null, skipped = false;
  const caret = document.createElement("span"); caret.className = "type-caret";
  function step() {
    if (skipped) return;
    if (!el) { el = document.createElement("p"); if (parts[p].cls) el.className = parts[p].cls; paper.appendChild(el); }
    const text = parts[p].t;
    c++;
    el.textContent = text.slice(0, c); el.appendChild(caret);
    if (c % 3 === 0) tone(1200, 0, .02, "square", .015);
    if (c >= text.length) {
      p++; c = 0; el = null;
      if (p >= parts.length) { caret.remove(); done(); return; }
      timer = setTimeout(step, 450);   // little pause between paragraphs
    } else {
      const ch = text[c - 1];
      timer = setTimeout(step, ".,!?".includes(ch) ? 220 : 38);
    }
  }
  paper.onclick = () => {
    if (skipped || p >= parts.length) return;
    skipped = true; clearTimeout(timer);
    paper.innerHTML = parts.map(x => `<p class="${x.cls}">${x.t.replace(/\n/g, "<br>")}</p>`).join("");
    done();
  };
  step();
}

    <button type="button" id="play">▶ Play</button>
    <button type="button" class="ghost back" id="back">← Back</button>`, s => {
    const tape = $("#tape", s), btn = $("#play", s), state = $("#songState", s), yt = $("#yt", s);
    const ytId = (CONFIG.youtube.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
    let playing = false, loop = null, track = CONFIG.song ? new Audio(CONFIG.song) : null;
    if (track) track.loop = true;
    const stop = () => { playing = false; clearInterval(loop); if (track) track.pause(); yt.innerHTML = ""; tape.classList.remove("playing"); btn.textContent = "▶ Play"; state.textContent = "paused"; };
    stopMusic = stop;
    btn.onclick = () => {
      if (playing) { stop(); return; }
      playing = true; tape.classList.add("playing"); btn.textContent = "❚❚ Pause"; state.textContent = "now playing ♪";
      if (ytId) yt.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&loop=1&playlist=${ytId}" title="${CONFIG.songTitle}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;

      else { if (!soundOn) soundBtn.click(); birthdaySong(); loop = setInterval(birthdaySong, 6000); }
    };
    $("#back", s).onclick = sceneItems;
  });
}
